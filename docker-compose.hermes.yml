services:
  hermes-proxy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      hermes-workforce:
        condition: service_healthy
    environment:
      HERMES_DOMAIN: ${HERMES_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/hermes/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  tala-agent:
    build:
      context: .
      dockerfile: services/hermes/Dockerfile
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      API_SERVER_KEY: ${HERMES_TALA_API_KEY}
      HERMES_MODEL: ${HERMES_TALA_MODEL:-meta-llama/llama-3.1-8b-instruct}
      HERMES_ROLE: tala
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      RESORT_CMS_KEY: ${RESORT_CMS_KEY:-marina_terrace_payload}
      HERMES_HOME: /data/hermes
    volumes:
      - tala-agent-data:/data/hermes
    ports:
      - "127.0.0.1:8642:8650"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8650/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  hermes-workforce:
    build:
      context: .
      dockerfile: services/hermes/Dockerfile
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      API_SERVER_KEY: ${HERMES_WORKFORCE_API_KEY}
      HERMES_MODEL: ${HERMES_WORKFORCE_MODEL:-mistralai/mistral-7b-instruct}
      HERMES_ROLE: workforce
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      RESORT_CMS_KEY: ${RESORT_CMS_KEY:-marina_terrace_payload}
      TALA_GITHUB_REPOSITORY: ${TALA_GITHUB_REPOSITORY:-merqatodigital/set-sail-project}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      HERMES_HOME: /data/hermes
    volumes:
      - hermes-workforce-data:/data/hermes
      - .:/workspace/set-sail-project:ro
    ports:
      - "127.0.0.1:8643:8650"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8650/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  tala-agent-data:
  hermes-workforce-data:
  caddy-data:
  caddy-config:
