name: Hermes TALA Driver

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "services/hermes/**"
      - "docker-compose.hermes.yml"
      - ".github/workflows/hermes-tala-driver.yml"
  pull_request:
    paths:
      - "src/**"
      - "services/hermes/**"
      - "docker-compose.hermes.yml"
      - ".github/workflows/hermes-tala-driver.yml"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate resort MCP syntax
        run: python -m py_compile services/hermes/manager.py services/hermes/mcp/resort_server.py
      - name: Build pinned Hermes runtime
        run: docker build -f services/hermes/Dockerfile .
